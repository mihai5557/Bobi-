<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТЕСТ Bobify</title>
<style>
body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
h1 { color: #1ed760; font-size: 20px; }
button { display: block; width: 100%; padding: 20px; margin: 10px 0; background: #1ed760; color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
#log { margin-top: 20px; padding: 10px; background: #222; border-radius: 5px; font-size: 14px; color: #fff; min-height: 50px; }
</style>
</head>
<body>

<h1>ТЕСТ 1.0</h1>
<p style="margin-bottom: 20px;">Нажимай кнопки по очереди и смотри на логи внизу.</p>

<!-- ТЕСТ 1: Inline onclick -->
<button onclick="alert('РАБОТАЕТ! Кнопка 1');">Тест 1 (onclick в HTML)</button>

<!-- ТЕСТ 2: Кнопка без onclick, привяжем через JS -->
<button id="test2">Тест 2 (через JavaScript)</button>

<!-- ТЕСТ 3: Ссылка -->
<a href="https://google.com" style="display:block; width:100%; padding: 20px; margin: 10px 0; background: #333; color: #fff; font-size: 18px; font-weight: bold; border-radius: 10px; text-align: center; text-decoration: none;">Тест 3 (Ссылка на Google)</a>

<div id="log">Лог инициализации...</div>

<script>
// Ловим ошибки
window.onerror = function(msg, url, line) {
  document.getElementById('log').innerHTML = '❌ ОШИБКА: ' + msg + ' (строка ' + line + ')';
  return false;
};

// Записываем, что скрипт запустился
document.getElementById('log').innerHTML = '✅ JavaScript загрузился успешно!';

// Привязываем вторую кнопку
try {
  document.getElementById('test2').onclick = function() {
    alert('РАБОТАЕТ! Кнопка 2 (JavaScript)');
    document.getElementById('log').innerHTML = '✅ Кнопка 2 сработала!';
  };
  document.getElementById('log').innerHTML += '<br>✅ Обработчик кнопки 2 привязан.';
} catch(e) {
  document.getElementById('log').innerHTML += '<br>❌ Ошибка привязки: ' + e.message;
}
</script>

</body>
</html>
