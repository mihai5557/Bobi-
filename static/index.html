<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bobify</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #121212; color: #fff; font-family: system-ui, sans-serif; padding: 15px; padding-bottom: 150px; }

.top-bar { display: flex; align-items: center; margin-bottom: 15px; }
.logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #1ed760; text-transform: uppercase; }
.header { display: flex; gap: 10px; margin-bottom: 25px; align-items: center; }
input { padding: 14px 18px; border-radius: 30px; border: none; background: #242424; color: #fff; flex: 1; font-size: 16px; outline: none; }

#btn-search { 
  background: #1ed760; border: none; width: 50px; height: 50px; border-radius: 50%; 
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
#btn-search:active { transform: scale(0.9); }

.section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; margin-top: 15px; }

.track { display: flex; align-items: center; gap: 8px; padding: 12px 5px; border-radius: 8px; border-bottom: 1px solid #282828; }
.track:active { background: #282828; }
.track img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #333; }
.track-info { flex: 1; min-width: 0; }
.t-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-artist { font-size: 13px; color: #aaa; }

.action-btn { background: none; border: none; padding: 6px; color: #aaa; cursor: pointer; display: flex; align-items: center; justify-content: center;}
.action-btn svg { width: 22px; height: 22px; display: block; }
.action-btn.active { color: #1ed760; }

.navbar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #282828; z-index: 50; }
.nav-item { display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 10px; cursor: pointer; gap: 4px; padding: 5px; flex: 1;}
.nav-item.active { color: #fff; }
.nav-item svg { width: 22px; height: 22px; fill: currentColor; }

#mini-player { display: none; position: fixed; bottom: 70px; left: 8px; right: 8px; background: #181818; padding: 10px 15px; align-items: center; gap: 12px; border-radius: 8px; z-index: 40; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
#mini-player img { width: 40px; height: 40px; border-radius: 4px; background: #333; }
.m-info { flex: 1; min-width: 0; }
.m-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.play-btn-mini { background: #1ed760; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #000;}
.play-btn-mini svg { width: 20px; height: 20px; display: block; }

#full-player { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, #2a2a2a 0%, #121212 100%); z-index: 100; padding: 20px; flex-direction: column; padding-top: 40px; }
.fp-header { display: flex; margin-bottom: 20px; }
.back-btn { background: rgba(0,0,0,0.6); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.fp-cover { width: 100%; max-width: 320px; margin: 0 auto 30px auto; aspect-ratio: 1; border-radius: 12px; object-fit: cover; display: block; background: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.fp-title { font-size: 24px; font-weight: 800; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.fp-artist { font-size: 16px; color: #aaa; margin-bottom: 20px; text-align: center; }
.fp-actions { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
.fp-action-btn { background: rgba(255,255,255,0.1); border: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
.fp-action-btn svg { width: 24px; height: 24px; display: block; }
.fp-action-btn.active { color: #1ed760; }
.progress-container { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; }
.time-text { font-size: 12px; color: #aaa; min-width: 35px; text-align: center; }
input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; margin-top: -5px; }
input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #4d4d4d; border-radius: 2px; }
.controls { display: flex; justify-content: center; align-items: center; gap: 30px; }
.ctrl-btn { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;}
.ctrl-btn svg { width: 32px; height: 32px; display: block; }
.play-btn-main { background: #1ed760; color: black; border: none; width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer;}
.play-btn-main svg { width: 32px; height: 32px; display: block; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">BOBIFY</div>
</div>

<div class="header" id="search-header">
  <input id="q" placeholder="Что послушаем?" onkeypress="if(event.key==='Enter') doSearch()">
  <button id="btn-search" onclick="doSearch()">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7"></circle><line x1="21" y1="21" x2="15" y2="15"></line><path d="M10 7v5.5"></path><circle cx="8.5" cy="12.5" r="1.5" fill="#000" stroke="none"></circle><path d="M10 7l2-1"></path>
    </svg>
  </button>
</div>

<div id="view-search" style="display:none;"><div id="list-search"></div></div>
<div id="view-favs" style="display:none;"><div id="list-favs"></div></div>
<div id="view-downloads" style="display:none;"><div id="list-downloads"></div></div>
<div id="view-playlists" style="display:none;"><div id="list-playlists"></div></div>

<div id="mini-player" onclick="openFullPlayer()">
  <img id="mini-thumb" src="">
  <div class="m-info"><div class="m-title" id="mini-title"></div></div>
  <button class="play-btn-mini" id="mini-play-btn" onclick="event.stopPropagation(); togglePlay()">
     <svg id="mini-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<div id="full-player">
  <div class="fp-header">
    <button class="back-btn" onclick="closeFullPlayer()">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
    </button>
  </div>
  <img id="fp-thumb" class="fp-cover" src="">
  <div class="fp-title" id="fp-title"></div>
  <div class="fp-artist" id="fp-artist"></div>
  
  <div class="fp-actions">
    <button id="fp-fav" class="fp-action-btn" onclick="toggleFavCurrent()"></button>
    <button id="fp-add" class="fp-action-btn" onclick="addCurrentToPlaylist()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="fp-dl" class="fp-action-btn" onclick="downloadCurrent()"></button>
  </div>

  <div class="progress-container">
    <span id="time-current" class="time-text">0:00</span>
    <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1" oninput="seekAudio()">
    <span id="time-total" class="time-text">0:00</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="playPrev()">
      <svg viewBox="0 0 24 24" fill="white"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="play-btn-main" id="main-play-btn" onclick="togglePlay()">
      <svg id="main-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" onclick="playNext()">
      <svg viewBox="0 0 24 24" fill="white"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>
</div>

<div class="navbar">
  <div class="nav-item active" id="tab-search" onclick="switchTab('search')">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Главная
  </div>
  <div class="nav-item" id="tab-playlists" onclick="switchTab('playlists')">
    <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>Плейлисты
  </div>
  <div class="nav-item" id="tab-favs" onclick="switchTab('favs')">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Избранное
  </div>
  <div class="nav-item" id="tab-downloads" onclick="switchTab('downloads')">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5z"/></svg>Скачанные
  </div>
</div>

<audio id="audio" ontimeupdate="updateProgress()" onended="playNext()"></audio>

<script>
var queue = [], currentIndex = -1;
var favs = [], downloads = [], playlists = {};
var currentPlaylistView = null;
var defaultImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23777'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>";

var iconPlay = '<path d="M8 5v14l11-7z"/>';
var iconPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
var iconDl = '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" fill="none" stroke="currentColor" stroke-width="2"/>';
var iconCheck = '<path d="M20 6L9 17l-5-5" fill="none" stroke="#1ed760" stroke-width="2"/>';
var iconHeart = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="currentColor" stroke-width="2"/>';
var iconHeartFill = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#1ed760" stroke="#1ed760" stroke-width="2"/>';
var iconAdd = '<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2"/>';

try { var f = localStorage.getItem('favs'); if(f) favs = JSON.parse(f); } catch(e) {}
try { var d = localStorage.getItem('downloads'); if(d) downloads = JSON.parse(d); } catch(e) {}
try { var p = localStorage.getItem('playlists'); if(p) playlists = JSON.parse(p); } catch(e) {}

var audio = document.getElementById('audio');

audio.onplay = function() {
  document.getElementById('main-play-icon').innerHTML = iconPause;
  document.getElementById('mini-play-icon').innerHTML = iconPause;
};
audio.onpause = function() {
  document.getElementById('main-play-icon').innerHTML = iconPlay;
  document.getElementById('mini-play-icon').innerHTML = iconPlay;
};

function switchTab(tab) {
  document.getElementById('tab-search').className = 'nav-item';
  document.getElementById('tab-playlists').className = 'nav-item';
  document.getElementById('tab-favs').className = 'nav-item';
  document.getElementById('tab-downloads').className = 'nav-item';
  document.getElementById('tab-' + tab).className = 'nav-item active';
  
  document.getElementById('view-search').style.display = 'none';
  document.getElementById('view-playlists').style.display = 'none';
  document.getElementById('view-favs').style.display = 'none';
  document.getElementById('view-downloads').style.display = 'none';
  
  if(tab === 'search') {
    document.getElementById('search-header').style.display = 'flex';
    document.getElementById('view-search').style.display = 'block';
    document.getElementById('list-search').innerHTML = '<p style="text-align:center; margin-top:40px; color:#aaa;">Введите название песни сверху!</p>';
  } else {
    document.getElementById('search-header').style.display = 'none';
    document.getElementById('view-' + tab).style.display = 'block';
    if(tab === 'favs') renderListTo('list-favs', favs, 'Избранное');
    if(tab === 'downloads') renderListTo('list-downloads', downloads, 'Скачанные');
    if(tab === 'playlists') renderPlaylists();
  }
}

// === ПЛЕЙЛИСТЫ ===
function renderPlaylists() {
  var container = document.getElementById('list-playlists');
  if(currentPlaylistView) {
    // Показываем треки внутри плейлиста
    var tracks = playlists[currentPlaylistView] || [];
    var html = '<div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">' +
               '<button onclick="currentPlaylistView=null; renderPlaylists();" style="background:none; border:none; color:#fff; font-size:24px;">←</button>' +
               '<div class="section-title" style="margin:0;">'+currentPlaylistView+'</div></div>';
    container.innerHTML = html;
    if(tracks.length === 0) { container.innerHTML += '<p style="color:#aaa;">Плейлист пуст</p>'; return; }
    
    // Сохраняем текущий плейлист в очередь для плеера
    window.currentPlaylistQueue = tracks;
    renderListTo('list-playlists', tracks, '');
    return;
  }

  var html = '<div class="section-title">Ваши плейлисты</div>';
  html += '<button onclick="createNewPlaylist()" style="width:100%; padding:15px; background:#282828; color:#fff; border:none; border-radius:8px; margin-bottom:15px; font-weight:bold; cursor:pointer;">+ Создать плейлист</button>';
  
  var keys = Object.keys(playlists);
  if(keys.length === 0) {
    container.innerHTML = html + '<p style="text-align:center; color:#aaa; margin-top:20px;">У вас пока нет плейлистов</p>';
    return;
  }

  for(var i=0; i<keys.length; i++) {
    var name = keys[i];
    var count = playlists[name].length;
    html += '<div onclick="currentPlaylistView=\''+name+'\'; renderPlaylists();" style="display:flex; align-items:center; gap:15px; padding:15px; background:#181818; border-radius:8px; margin-bottom:10px; cursor:pointer;">' +
            '<svg viewBox="0 0 24 24" width="30" height="30" fill="#aaa"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>' +
            '<div><div style="font-weight:bold; font-size:16px;">'+name+'</div><div style="font-size:13px; color:#aaa;">'+count+' треков</div></div>' +
            '</div>';
  }
  container.innerHTML = html;
}

function createNewPlaylist() {
  var name = prompt("Введите название плейлиста:");
  if(!name || name.trim() === '') return;
  name = name.trim();
  if(!playlists[name]) {
    playlists[name] = [];
    localStorage.setItem('playlists', JSON.stringify(playlists));
    renderPlaylists();
  } else {
    alert("Такой плейлист уже есть!");
  }
}

function addToPlaylistById(id) {
  var track = null;
  for(var i=0; i<queue.length; i++) { if(queue[i].id === id) track = queue[i]; }
  if(!track) return;

  var keys = Object.keys(playlists);
  if(keys.length === 0) {
    var newName = prompt("У вас нет плейлистов. Создать новый (введите название):");
    if(!newName) return;
    playlists[newName] = [track];
    localStorage.setItem('playlists', JSON.stringify(playlists));
    alert("Добавлено в новый плейлист: " + newName);
    return;
  }

  var msg = "В какой плейлист добавить?\n\n";
  for(var i=0; i<keys.length; i++) { msg += (i+1) + ". " + keys[i] + "\n"; }
  msg += "\n(Введите номер плейлиста, или 0 для создания нового)";

  var choice = prompt(msg);
  if(choice === null) return;
  var num = parseInt(choice);
  
  if(num === 0) {
    var newName = prompt("Название нового плейлиста:");
    if(newName) {
      playlists[newName] = [track];
      localStorage.setItem('playlists', JSON.stringify(playlists));
      alert("Добавлено в: " + newName);
    }
  } else if(num > 0 && num <= keys.length) {
    var pName = keys[num-1];
    // Проверяем, нет ли уже этого трека
    var exists = false;
    for(var j=0; j<playlists[pName].length; j++) { if(playlists[pName][j].id === track.id) exists = true; }
    if(!exists) {
      playlists[pName].push(track);
      localStorage.setItem('playlists', JSON.stringify(playlists));
      alert("Добавлено в плейлист: " + pName);
    } else {
      alert("Этот трек уже есть в плейлисте " + pName);
    }
  }
}

function addCurrentToPlaylist() {
  if(currentIndex !== -1) addToPlaylistById(queue[currentIndex].id);
}

// === ОСНОВНЫЕ ФУНКЦИИ ===
function doSearch() {
  var q = document.getElementById('q').value; if(!q) return;
  switchTab('search');
  var list = document.getElementById('list-search');
  list.innerHTML = '<p style="text-align:center; padding:20px;">Поиск...</p>';
  
  fetch('/search?q=' + encodeURIComponent(q))
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if(data.error) { list.innerText = data.error; return; }
    window.searchResults = data;
    queue = data;
    list.innerHTML = '<div class="section-title">Результаты</div>';
    renderListTo('list-search', data, '');
  }).catch(function() { list.innerText = 'Ошибка сети (Сервер спит)'; });
}

function renderListTo(containerId, data, title) {
  var container = document.getElementById(containerId);
  var html = '';
  if(title) html += '<div class="section-title">' + title + '</div>';
  if(data.length === 0 && title) { container.innerHTML = html + '<p style="text-align:center; color:#aaa; margin-top:20px;">Пусто</p>'; return; }
  
  for(var i=0; i<data.length; i++) {
    var track = data[i];
    var isFav = false; for(var j=0; j<favs.length; j++) { if(favs[j].id === track.id) isFav = true; }
    var isDl = false; for(var k=0; k<downloads.length; k++) { if(downloads[k].id === track.id) isDl = true; }
    
    html += '<div class="track">' +
              '<img src="'+(track.thumb||defaultImg)+'" onerror="this.src=\''+defaultImg+'\'" onclick="playTrackFromList(\''+track.id+'\')">' +
              '<div class="track-info" onclick="playTrackFromList(\''+track.id+'\')"><div class="t-title">'+track.title+'</div><div class="t-artist">'+track.artist+'</div></div>' +
              '<button class="action-btn '+(isFav?'active':'')+'" onclick="toggleFavById(\''+track.id+'\', this)"><svg viewBox="0 0 24 24">'+(isFav?iconHeartFill:iconHeart)+'</svg></button>' +
              '<button class="action-btn" onclick="addToPlaylistById(\''+track.id+'\')"><svg viewBox="0 0 24 24">'+iconAdd+'</svg></button>' +
              '<button class="action-btn" onclick="downloadById(\''+track.id+'\', this)"><svg viewBox="0 0 24 24">'+(isDl?iconCheck:iconDl)+'</svg></button>' +
            '</div>';
  }
  container.innerHTML = html;
}

function playTrackFromList(id) {
  var list = queue;
  if(window.currentPlaylistQueue) list = window.currentPlaylistQueue;
  for(var i=0; i<list.length; i++) { if(list[i].id === id) { queue = list; playTrack(i); return; } }
}

function toggleFavById(id, btn) {
  var track = null;
  for(var i=0; i<queue.length; i++) { if(queue[i].id === id) track = queue[i]; }
  if(!track) return;

  var idx = -1;
  for(var i=0; i<favs.length; i++) { if(favs[i].id === id) idx = i; }
  
  if(idx !== -1) { 
    favs.splice(idx, 1); 
    if(btn) { btn.className = 'action-btn'; btn.innerHTML = '<svg viewBox="0 0 24 24">'+iconHeart+'</svg>'; }
  } else { 
    favs.push(track); 
    if(btn) { btn.className = 'action-btn active'; btn.innerHTML = '<svg viewBox="0 0 24 24">'+iconHeartFill+'</svg>'; }
  }
  
  localStorage.setItem('favs', JSON.stringify(favs));
  if(currentIndex !== -1 && queue[currentIndex].id === id) {
    document.getElementById('fp-fav').className = idx === -1 ? 'fp-action-btn active' : 'fp-action-btn';
    document.getElementById('fp-fav').innerHTML = '<svg vi
