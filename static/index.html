<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bobify Test</title>
<style>
body { background: #121212; color: #fff; font-family: system-ui, sans-serif; padding: 15px; }
h2 { color: #1ed760; text-transform: uppercase; margin-bottom: 20px; }
.input-group { display: flex; gap: 10px; margin-bottom: 20px; }
input { padding: 14px; border-radius: 30px; border: none; background: #242424; color: #fff; flex: 1; font-size: 16px; }
button { background: #1ed760; border: none; padding: 0 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }
.track { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #282828; }
.track img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
.track .info { flex: 1; }
.track .title { font-weight: bold; font-size: 15px; }
.track .artist { font-size: 13px; color: #aaa; }
</style>
</head>
<body>

<h2>Bobify Test</h2>

<div class="input-group">
  <input id="q" placeholder="Название песни" onkeypress="if(event.key==='Enter') doSearch()">
  <button onclick="doSearch()">Найти</button>
</div>

<div id="list"></div>

<!-- Скрытый плеер (просто чтобы проверить, работает ли звук) -->
<audio id="audio" controls style="width:100%; margin-top:20px; display:none;"></audio>

<script>
function doSearch() {
  var q = document.getElementById('q').value;
  if(!q) return;
  document.getElementById('list').innerHTML = '<p>Ищем...</p>';
  
  fetch('/search?q=' + encodeURIComponent(q))
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var list = document.getElementById('list');
    list.innerHTML = '';
    
    if(data.error) { list.innerHTML = '<p style="color:red">' + data.error + '</p>'; return; }
    
    for(var i=0; i<data.length; i++) {
      var t = data[i];
      var div = document.createElement('div');
      div.className = 'track';
      div.onclick = function() {
        playThisSong(t.url);
      };
      
      div.innerHTML = '<img src="' + (t.thumb || '') + '">' +
                      '<div class="info"><div class="title">' + t.title + '</div><div class="artist">' + t.artist + '</div></div>';
      list.appendChild(div);
    }
  })
  .catch(function() {
    document.getElementById('list').innerHTML = '<p style="color:red">Ошибка сети (Сервер спит). Подожди минуту и попробуй снова.</p>';
  });
}

function playThisSong(url) {
  var audio = document.getElementById('audio');
  audio.style.display = 'block';
  audio.pause();
  audio.src = '';
  
  // Включаем "крутилку" загрузки на кнопке поиска
  document.getElementById('q').value = 'Загрузка...';
  
  fetch('/stream_url?url=' + encodeURIComponent(url))
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if(d.stream_url) {
      audio.src = d.stream_url;
      audio.play();
      document.getElementById('q').value = ''; // Очищаем поле после загрузки
    } else {
      alert('Не удалось загрузить трек');
    }
  }).catch(function() {
    alert('Ошибка загрузки');
  });
}
</script>
</body>
</html>
