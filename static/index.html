<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spotify</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #121212; color: #fff; font-family: system-ui, sans-serif; padding: 15px; padding-bottom: 150px; }
.header { display: flex; gap: 10px; margin-bottom: 20px; }
input { padding: 12px; border-radius: 20px; border: none; background: #242424; color: #fff; flex: 1; font-size: 16px; outline: none; }
.btn-search { padding: 12px 20px; border-radius: 20px; border: none; background: #1ed760; font-weight: bold; color: #000; cursor: pointer;}

.section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; margin-top: 15px; }
.genres-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
.genre-card { padding: 15px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; height: 80px; display: flex; align-items: flex-start; }
.genre-card:active { opacity: 0.8; }

.track { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; }
.track:active { background: #282828; }
.track img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #333; }
.t-info { flex: 1; min-width: 0; }
.t-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-artist { font-size: 13px; color: #aaa; }
.action-btn { background: none; border: none; font-size: 22px; padding: 8px; color: #aaa; cursor: pointer; display: flex; align-items: center; justify-content: center;}
.action-btn.active { color: #1ed760; }

.navbar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #282828; z-index: 50; }
.nav-item { display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 11px; cursor: pointer; gap: 4px; }
.nav-item.active { color: #fff; }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }

#mini-player { display: none; position: fixed; bottom: 60px; left: 8px; right: 8px; background: #181818; padding: 10px 15px; align-items: center; gap: 12px; border-radius: 8px; z-index: 40; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer;}
#mini-player img { width: 40px; height: 40px; border-radius: 4px; background: #333; }
.m-info { flex: 1; min-width: 0; }
.m-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.play-btn-mini { background: #1ed760; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 14px; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center;}

#full-player { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, #2a2a2a 0%, #121212 100%); z-index: 100; padding: 20px; flex-direction: column; padding-top: 40px; }
.fp-header { display: flex; margin-bottom: 20px; }
.back-btn { background: rgba(0,0,0,0.6); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.fp-cover { width: 100%; max-width: 320px; margin: 0 auto 30px auto; aspect-ratio: 1; border-radius: 12px; object-fit: cover; display: block; background: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.fp-title { font-size: 24px; font-weight: 800; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.fp-artist { font-size: 16px; color: #aaa; margin-bottom: 20px; text-align: center; }
.fp-actions { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; }
.fp-action-btn { background: rgba(255,255,255,0.1); border: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
.fp-action-btn.active { color: #1ed760; }
.progress-container { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; }
.time-text { font-size: 12px; color: #aaa; min-width: 35px; text-align: center; }
input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; margin-top: -5px; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #4d4d4d; border-radius: 2px; }
.controls { display: flex; justify-content: center; align-items: center; gap: 30px; }
.ctrl-btn { background: none; border: none; color: white; font-size: 32px; cursor: pointer; }
.play-btn-main { background: #1ed760; color: black; border: none; width: 70px; height: 70px; border-radius: 50%; font-size: 28px; display: flex; justify-content: center; align-items: center; cursor: pointer;}
</style>
</head>
<body>

<div id="view-search" style="display:none;">
  <div class="header">
    <input id="q" placeholder="Что послушаем?" onkeypress="if(event.key==='Enter') search()">
    <button class="btn-search" onclick="search()">Найти</button>
  </div>
  <div id="list-search"></div>
</div>

<div id="view-home" style="display:none;">
  <div id="home-content"></div>
</div>

<div id="view-library" style="display:none;">
  <div id="list-library"></div>
</div>

<div id="mini-player" onclick="openFull()">
  <img id="mini-thumb" src="">
  <div class="m-info"><div class="m-title" id="mini-title"></div></div>
  <button class="play-btn-mini" id="mini-play-btn" onclick="event.stopPropagation(); togglePlay()">▶</button>
</div>

<div id="full-player">
  <div class="fp-header">
    <button class="back-btn" onclick="closeFull()"><svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></button>
  </div>
  <img id="fp-thumb" class="fp-cover" src="">
  <div class="fp-title" id="fp-title"></div>
  <div class="fp-artist" id="fp-artist"></div>
  <div class="fp-actions">
    <button id="fp-fav-btn" class="fp-action-btn" onclick="toggleFavFull()"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
    <button id="fp-dl-btn" class="fp-action-btn" onclick="downloadFull()"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
  </div>
  <div class="progress-container">
    <span id="time-current" class="time-text">0:00</span>
    <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1" oninput="seek()">
    <span id="time-total" class="time-text">0:00</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="playPrev()">⏮</button>
    <button class="play-btn-main" id="main-play-btn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="playNext()">⏭</button>
  </div>
</div>

<div class="navbar">
  <div class="nav-item" onclick="switchTab('home')" id="tab-home">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Главная
  </div>
  <div class="nav-item" onclick="switchTab('search')" id="tab-search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Поиск
  </div>
  <div class="nav-item" onclick="switchTab('favs')" id="tab-favs">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Избранное
  </div>
  <div class="nav-item" onclick="switchTab('downloads')" id="tab-downloads">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Скачанные
  </div>
</div>

<audio id="audio" ontimeupdate="updateProgress()" onended="playNext()"></audio>

<script>
// Безопасная загрузка данных
function getStorage(key) {
    try { 
        var item = localStorage.getItem(key); 
        if (!item) return []; 
        var parsed = JSON.parse(item);
        return Array.isArray(parsed) ? parsed : [];
    } catch(e) { return []; }
}

var queue = [];
var currentIndex = -1;
var favs = getStorage('favs');
var downloads = getStorage('downloads');
var defaultImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23777'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>";

var genres = [
  { name: 'Рэп', color: '#ba5d07', query: 'rap hits' },
  { name: 'Поп', color: '#8d67ab', query: 'pop music' },
  { name: 'Фонк', color: '#148a08', query: 'phonk' },
  { name: 'Рок', color: '#e91429', query: 'rock classics' },
  { name: 'Lo-Fi', color: '#503750', query: 'lofi beats' },
  { name: 'Инди', color: '#dc148c', query: 'indie music' },
  { name: 'Хип-Хоп', color: '#0d72ea', query: 'hip hop' },
  { name: 'Джаз', color: '#e8115b', query: 'jazz' }
];

function switchTab(tab) {
  var navs = document.querySelectorAll('.nav-item');
  for(var i=0; i<navs.length; i++) { navs[i].classList.remove('active'); }
  var activeTab = document.getElementById('tab-' + tab);
  if(activeTab) activeTab.classList.add('active');
  
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-search').style.display = 'none';
  document.getElementById('view-library').style.display = 'none';

  if (tab === 'home') {
    document.getElementById('view-home').style.display = 'block';
    renderHome();
  } else if (tab === 'search') {
    document.getElementById('view-search').style.display = 'block';
  } else {
    document.getElementById('view-library').style.display = 'block';
    renderLibrary(tab);
  }
}

function renderHome() {
  var html = '<div class="section-title">Жанры и настроения</div><div class="genres-grid">';
  for(var i=0; i<genres.length; i++) {
    var g = genres[i];
    html += '<div class="genre-card" style="background:'+g.color+'" onclick="searchByGenre(\''+g.query+'\')">'+g.name+'</div>';
  }
  html += '</div>';
  document.getElementById('home-content').innerHTML = html;
}

function searchByGenre(query) {
  switchTab('search');
  document.getElementById('q').value = query;
  search();
}

function renderLibrary(tab) {
  var data = tab === 'favs' ? favs : downloads;
  var title = tab === 'favs' ? 'Избранное' : 'Скачанные';
  
  if (data.length === 0) {
    document.getElementById('list-library').innerHTML = '<h2 style="text-align:center;margin-top:40px;color:#aaa;">Пусто</h2>';
    return;
  }

  var html = '<div class="section-title">' + title + '</div>';
  for(var i=0; i<data.length; i++) {
    var t = data[i];
    var isFav = false;
    for(var j=0; j<favs.length; j++) { if(favs[j].id === t.id) isFav = true; }
    var isDl = false;
    for(var k=0; k<downloads.length; k++) { if(downloads[k].id === t.id) isDl = true; }
    
    var thumb = t.thumb ? t.thumb : defaultImg;
    
    html += '<div class="track">' +
      '<img src="'+thumb+'" onerror="this.src=\''+defaultImg+'\'" onclick="playFromLibrary(\''+tab+'\', '+i+')">' +
      '<div class="t-info" onclick="playFromLibrary(\''+tab+'\', '+i+')">' +
        '<div class="t-title">'+t.title+'</div>' +
        '<div class="t-artist">'+t.artist+'</div>' +
      '</div>' +
      '<button class="action-btn '+(isFav?'active':'')+'" onclick="toggleFavItem('+i+', \''+tab+'\', this)">'+(isFav?getHeartIcon(true):getHeartIcon(false))+'</button>' +
      '<button class="action-btn" onclick="downloadTrackItem('+i+', \''+tab+'\', this)">'+(isDl?getCheckIcon():getDlIcon())+'</button>' +
    '</div>';
  }
  document.getElementById('list-library').innerHTML = html;
}

function playFromLibrary(tab, index) {
  var data = tab === 'favs' ? favs : downloads;
  queue = data; 
  playTrack(index);
}

function search() {
  var q = document.getElementById('q').value; if(!q) return;
  document.getElementById('list-search').innerHTML = '<p style="text-align:center;padding:20px;">Поиск...</p>';
  
  fetch('/search?q=' + encodeURIComponent(q))
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if(data.error) { document.getElementById('list-search').innerText = data.error; return; }
    queue = data;
    var html = '<div class="section-title">Результаты</div>';
    for(var i=0; i<queue.length; i++) {
      var t = queue[i];
      var isFav = false;
      for(var j=0; j<favs.length; j++) { if(favs[j].id === t.id) isFav = true; }
      var isDl = false;
      for(var k=0; k<downloads.length; k++) { if(downloads[k].id === t.id) isDl = true; }
      
      var thumb = t.thumb ? t.thumb : defaultImg;
      
      html += '<div class="track">' +
        '<img src="'+thumb+'" onerror="this.src=\''+defaultImg+'\'" onclick="playTrack('+i+')">' +
        '<div class="t-info" onclick="playTrack('+i+')">' +
          '<div class="t-title">'+t.title+'</div>' +
          '<div class="t-artist">'+t.artist+'</div>' +
        '</div>' +
        '<button class="action-btn '+(isFav?'active':'')+'" onclick="toggleFavSearch('+i+', this)">'+(isFav?getHeartIcon(true):getHeartIcon(false))+'</button>' +
        '<button class="action-btn" onclick="downloadSearch('+i+', this)">'+(isDl?getCheckIcon():getDlIcon())+'</button>' +
      '</div>';
    }
    document.getElementById('list-search').innerHTML = html;
  }).catch(function(e) { document.getElementById('list-search').innerText = 'Ошибка сети'; });
}

function toggleFavSearch(index, btn) {
  var t = queue[index];
  var found = -1;
  for(var i=0; i<favs.length; i++) { if(favs[i].id === t.id) found = i; }
  
  if (found !== -1) {
    favs.splice(found, 1);
    btn.classList.remove('active'); btn.innerHTML = getHeartIcon(false);
  } else {
    favs.push(t); btn.classList.add('active'); btn.innerHTML = getHeartIcon(true);
  }
  localStorage.setItem('favs', JSON.stringify(favs));
  syncFullPlayerFav();
}

function toggleFavItem(index, tab, btn) {
  var data = tab === 'favs' ? favs : downloads;
  var t = data[index];
  var found = -1;
  for(var i=0; i<favs.length; i++) { if(favs[i].id === t.id) found = i; }
  
  if (found !== -1) {
    favs.splice(found, 1);
    btn.classList.remove('active'); btn.innerHTML = getHeartIcon(false);
    if (tab === 'favs') renderLibrary('favs');
  } else {
    favs.push(t); btn.classList.add('active'); btn.innerHTML = getHeartIcon(true);
  }
  localStorage.setItem('favs', JSON.stringify(favs));
}

function downloadSearch(index, btn) { downloadAction(queue[index], btn); }
function downloadTrackItem(index, tab, btn) {
  var data = tab === 'favs' ? favs : downloads;
  downloadAction(data[index], btn);
}

function downloadAction(t, btn) {
  btn.innerHTML = '⏳';
  fetch('/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id: t.id, url: t.url})})
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if(d.error) throw new Error(d.error);
    var found = -1;
    for(var i=0; i<downloads.length; i++) { if(downloads[i].id === t.id) found = i; }
    if (found !== -1) downloads.splice(found, 1);
    t.file = d.file;
    downloads.push(t);
    localStorage.setItem('downloads', JSON.stringify(downloads));
    btn.innerHTML = getCheckIcon();
  }).catch(function(e) { alert(e.message); btn.innerHTML = getDlIcon(); });
}

function playTrack(index) {
  currentIndex = index; 
  var t = queue[index];
  var imgSrc = t.thumb ? t.thumb : defaultImg;
  
  document.getElementById('full-player').style.display = 'flex';
  document.getElementById('mini-player').style.display = 'flex';
  document.getElementById('fp-thumb').src = imgSrc; 
  document.getElementById('mini-thumb').src = imgSrc;
  document.getElementById('fp-title').innerText = t.title; 
  document.getElementById('mini-title').innerText = t.title;
  document.getElementById('fp-artist').innerText = 'Загрузка...'; 
  
  syncFullPlayerFav();
  var fpDl = document.getElementById('fp-dl-btn');
  var downloadedTrack = null;
  for(var i=0; i<downloads.length; i++) { if(downloads[i].id === t.id) downloadedTrack = downloads[i]; }
  
  fpDl.innerHTML = downloadedTrack ? getCheckIcon() : getDlIcon();

  var audio = document.getElementById('audio'); 
  audio.pause(); document.getElementById('main-play-btn').innerText = '⏳';
  
  if (downloadedTrack) {
    audio.src = '/play/' + downloadedTrack.file;
    audio.load();
    audio.play().then(function() { 
      document.getElementById('main-play-btn').innerText = '❚❚'; 
      document.getElementById('mini-play-btn').innerText = '❚❚'; 
    });
    document.getElementById('fp-artist').innerText = t.artist; 
    return;
  }

  fetch('/stream_url?url=' + encodeURIComponent(t.url))
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.stream_url) {
       audio.src = d.stream_url;
       audio.load();
       audio.play().then(function() { 
         document.getElementById('main-play-btn').innerText = '❚❚'; 
         document.getElementById('mini-play-btn').innerText = '❚❚'; 
       });
       document.getElementById('fp-artist').innerText = t.artist; 
    } else { throw new Error('no stream'); }
  }).catch(function(e) {
     fetch('/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id: t.id, url: t.url})})
     .then(function(r) { return r.json(); })
     .then(function(d) {
        if(d.error) throw new Error(d.error);
        t.file = d.file;
        downloads.push(t);
        localStorage.setItem('downloads', JSON.stringify(downloads));
        fpDl.innerHTML = getCheckIcon();
        audio.src = '/play/' + t.file; 
        audio.load();
        audio.play().then(function() { 
          document.getElementById('main-play-btn').innerText = '❚❚'; 
          document.getElementById('mini-play-btn').innerText = '❚❚'; 
        });
        document.getElementById('fp-artist').innerText = t.artist; 
     }).catch(function(err) { 
        alert("Ошибка: " + err.message); 
        document.getElementById('main-play-btn').innerText = '▶'; 
        document.getElementById('fp-artist').innerText = 'Ошибка'; 
     });
  });
}

function syncFullPlayerFav() {
  if(currentIndex === -1) return;
  var t = queue[currentIndex];
  var isFav = false;
  for(var i=0; i<favs.length; i++) { if(favs[i].id === t.id) isFav = true; }
  var fpFav = document.getElementById('fp-fav-btn');
  if(isFav) fpFav.classList.add('active'); else fpFav.classList.remove('active');
  fpFav.innerHTML = getHeartIcon(isFav);
}

function toggleFavFull() {
  if(currentIndex === -1) return;
  var t = queue[currentIndex];
  var found = -1;
  for(var i=0; i<favs.length; i++) { if(favs[i].id === t.id) found = i; }
  
  if (found !== -1) favs.splice(found, 1);
  else favs.push(t);
  localStorage.setItem('favs', JSON.stringify(favs));
  syncFullPlayerFav();
}

function downloadFull() {
  if(currentIndex === -1) return;
  downloadAction(queue[currentIndex], document.getElementById('fp-dl-btn'));
}

function togglePlay() {
  var a = document.getElementById('audio'); if(!a.src) return;
  if(a.paused) { a.play(); document.getElementById('main-play-btn').innerText = '❚❚'; document.getElementById('mini-play-btn').innerText = '❚❚'; }
  else { a.pause(); document.getElementById('main-play-btn').innerText = '▶'; document.getElementById('mini-play-btn').innerText = '▶'; }
}
function playNext() { if(queue.l
