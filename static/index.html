<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>Bobify</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
body { background: #121212; color: #fff; font-family: system-ui, sans-serif; padding: 15px; padding-bottom: 150px; }
input { -webkit-user-select: text; user-select: text; }

.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #1ed760; text-transform: uppercase; }
.download-app-btn { background: #1ed760; color: #000; text-decoration: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; }
.header { display: flex; gap: 10px; margin-bottom: 25px; align-items: center; }
input { padding: 14px 18px; border-radius: 30px; border: none; background: #242424; color: #fff; flex: 1; font-size: 16px; outline: none; }
#btn-search { background: #1ed760; border: none; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }

.section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; margin-top: 15px; }

/* Горизонтальная шторка для рекомендаций */
.h-scroll { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
.h-scroll::-webkit-scrollbar { display: none; }
.h-card { flex: 0 0 120px; background: #181818; padding: 10px; border-radius: 10px; cursor: pointer; }
.h-card:active { background: #282828; }
.h-card img { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; margin-bottom: 8px; background: #333; }
.h-card .h-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-card .h-artist { font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }

/* Обычные треки */
.track { display: flex; align-items: center; gap: 8px; padding: 12px 5px; border-radius: 8px; border-bottom: 1px solid #282828; cursor: pointer; }
.track:active { background: #282828; }
.track img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #333; }
.track-info { flex: 1; min-width: 0; }
.t-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-artist { font-size: 13px; color: #aaa; }
.action-btn { background: none; border: none; padding: 6px; color: #aaa; cursor: pointer; font-size: 20px;}
.action-btn.active { color: #1ed760; }

.navbar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #282828; z-index: 50; }
.nav-item { display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 11px; cursor: pointer; gap: 4px; padding: 5px 15px; }
.nav-item.active { color: #fff; }

#mini-player { display: none; position: fixed; bottom: 70px; left: 8px; right: 8px; background: #181818; padding: 10px 15px; align-items: center; gap: 12px; border-radius: 8px; z-index: 40; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer;}
#mini-player img { width: 40px; height: 40px; border-radius: 4px; }
.m-info { flex: 1; min-width: 0; }
.m-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.play-btn-mini { background: #1ed760; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; color: #000; cursor: pointer;}

#full-player { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(180deg, #2a2a2a 0%, #121212 100%); z-index: 100; padding: 20px; flex-direction: column; padding-top: 40px; }
.fp-header { display: flex; margin-bottom: 20px; }
.back-btn { background: rgba(0,0,0,0.6); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; cursor: pointer; }
.fp-cover { width: 100%; max-width: 320px; margin: 0 auto 30px auto; aspect-ratio: 1; border-radius: 12px; object-fit: cover; display: block; background: #333; }
.fp-title { font-size: 24px; font-weight: 800; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.fp-artist { font-size: 16px; color: #aaa; margin-bottom: 20px; text-align: center; }
.fp-actions { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; }
.fp-action-btn { background: rgba(255,255,255,0.1); border: none; width: 46px; height: 46px; border-radius: 50%; font-size: 20px; color: white; cursor: pointer; }
.fp-action-btn.active { color: #1ed760; }
.progress-container { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; }
.time-text { font-size: 12px; color: #aaa; min-width: 35px; text-align: center; }
input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; margin-top: -5px; }
input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #4d4d4d; border-radius: 2px; }
.controls { display: flex; justify-content: center; align-items: center; gap: 30px; }
.ctrl-btn { background: none; border: none; color: white; font-size: 32px; cursor: pointer; }
.play-btn-main { background: #1ed760; color: black; border: none; width: 70px; height: 70px; border-radius: 50%; font-size: 28px; cursor: pointer;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">BOBIFY</div>
  <a href="https://github.com/mihai5557/Bobi-/releases/download/V1.0/Bobify.apk" class="download-app-btn">Скачать</a>
</div>

<div class="header" id="search-header">
  <input id="q" placeholder="Что послушаем?">
  <button id="btn-search" onclick="doSearch()">🔍</button>
</div>

<div id="view-search">
  <div id="home-recommendations"></div>
  <div id="list-search"></div>
</div>

<div id="view-favs" style="display:none;"><div id="list-favs"></div></div>
<div id="view-downloads" style="display:none;"><div id="list-downloads"></div></div>

<div id="mini-player" onclick="document.getElementById('full-player').style.display='flex'">
  <img id="mini-thumb" src="">
  <div class="m-info"><div class="m-title" id="mini-title"></div></div>
  <button class="play-btn-mini" id="mini-play-btn" onclick="event.stopPropagation(); togglePlay()">▶</button>
</div>

<div id="full-player">
  <div class="fp-header">
    <button class="back-btn" onclick="document.getElementById('full-player').style.display='none'">⌄</button>
  </div>
  <img id="fp-thumb" class="fp-cover" src="">
  <div class="fp-title" id="fp-title"></div>
  <div class="fp-artist" id="fp-artist"></div>
  
  <div class="fp-actions">
    <button id="fp-fav" class="fp-action-btn" onclick="toggleFavCurrent()">♡</button>
    <button id="fp-dl" class="fp-action-btn" onclick="downloadCurrent()">⬇</button>
  </div>

  <div class="progress-container">
    <span id="time-current" class="time-text">0:00</span>
    <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1" oninput="seekAudio()">
    <span id="time-total" class="time-text">0:00</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="playPrev()">⏮</button>
    <button class="play-btn-main" id="main-play-btn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="playNext()">⏭</button>
  </div>
</div>

<div class="navbar">
  <div class="nav-item active" id="tab-search" onclick="switchTab('search')">🏠 Главная</div>
  <div class="nav-item" id="tab-favs" onclick="switchTab('favs')">❤️ Избранное</div>
  <div class="nav-item" id="tab-downloads" onclick="switchTab('downloads')">⬇ Скачанные</div>
</div>

<audio id="audio"></audio>

<script>
var queue = [], currentIndex = -1;
var favs = [], downloads = [];
var defaultImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23777'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>";

try { var f = localStorage.getItem('favs'); if(f) favs = JSON.parse(f); } catch(e) {}
try { var d = localStorage.getItem('downloads'); if(d) downloads = JSON.parse(d); } catch(e) {}

// Загружаем последний прослушанный трек
var lastPlayed = null;
try { var lp = localStorage.getItem('lastPlayed'); if(lp) lastPlayed = JSON.parse(lp); } catch(e) {}

var audio = document.getElementById('audio');

audio.addEventListener('ended', function() { playNext(); });
audio.onplay = function() { document.getElementById('main-play-btn').innerText = '❚❚'; document.getElementById('mini-play-btn').innerText = '❚❚'; };
audio.onpause = function() { document.getElementById('main-play-btn').innerText = '▶'; document.getElementById('mini-play-btn').innerText = '▶'; };
audio.ontimeupdate = function() {
  if(!audio.duration || audio.duration === Infinity) return;
  document.getElementById('seekBar').value = (audio.currentTime / audio.duration) * 100;
  document.getElementById('time-current').innerText = fmt(audio.currentTime);
  document.getElementById('time-total').innerText = fmt(audio.duration);
};

function switchTab(tab) {
  document.getElementById('tab-search').className = 'nav-item';
  document.getElementById('tab-favs').className = 'nav-item';
  document.getElementById('tab-downloads').className = 'nav-item';
  document.getElementById('tab-' + tab).className = 'nav-item active';
  
  document.getElementById('view-search').style.display = 'none';
  document.getElementById('view-favs').style.display = 'none';
  document.getElementById('view-downloads').style.display = 'none';
  
  if(tab === 'search') {
    document.getElementById('search-header').style.display = 'flex';
    document.getElementById('view-search').style.display = 'block';
    
    // Каждый раз при заходе на главную обновляем рекомендации
    loadRecommendations();
  } else {
    document.getElementById('search-header').style.display = 'none';
    document.getElementById('view-' + tab).style.display = 'block';
    if(tab === 'favs') renderList('list-favs', favs, 'Избранное');
    if(tab === 'downloads') renderList('list-downloads', downloads, 'Скачанные');
  }
}

// === ЛОГИКА РЕКОМЕНДАЦИЙ ===
function loadRecommendations() {
    var container = document.getElementById('home-recommendations');
    var query = '';
    var title = '';

    // Если есть последний трек — ищем по его исполнителю
    if (lastPlayed && lastPlayed.artist && lastPlayed.artist !== 'SoundCloud') {
        query = lastPlayed.artist;
        title = 'Похожие на ' + lastPlayed.artist;
    } else if (lastPlayed && lastPlayed.title) {
        // Если артист неизвестен, ищем по названию
        query = lastPlayed.title;
        title = 'Рекомендуем послушать';
    } else {
        // Если ничего не слушали — рандомный жанр
        var genres = ['lofi', 'phonk', 'rap hits', 'pop music'];
        query = genres[Math.floor(Math.random() * genres.length)];
        title = 'Рекомендуем послушать';
    }

    container.innerHTML = '<div class="section-title">🎵 ' + title + '</div><p style="color:#aaa; font-size:12px;">Загрузка...</p>';

    fetch('/search?q=' + encodeURIComponent(query))
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = '<div class="section-title">🎵 ' + title + '</div><p style="color:#aaa; font-size:12px;">Не удалось найти похожие треки</p>';
            return;
        }
        
        // Фильтруем: убираем тот трек, который сейчас играет
        var recs = [];
        for (var i = 0; i < data.length; i++) {
            if (lastPlayed && data[i].id === lastPlayed.id) continue; // Пропускаем текущий трек
            recs.push(data[i]);
            if (recs.length >= 6) break; // Берем только 6 штук
        }

        if (recs.length === 0) {
            container.innerHTML = '<div class="section-title">🎵 ' + title + '</div><p style="color:#aaa; font-size:12px;">Похожих треков пока нет</p>';
            return;
        }

        window.recQueue = recs; 
        
        var html = '<div class="section-title">🎵 ' + title + '</div><div class="h-scroll">';
        for (var j = 0; j < recs.length; j++) {
            var t = recs[j];
            var safeTitle = (t.title||'').replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c] || c; });
            var safeArtist = (t.artist||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c] || c; });
            
            html += '<div class="h-card" onclick="playRecommendation(' + j + ')">' +
                    '<img src="' + (t.thumb || defaultImg) + '">' +
                    '<div class="h-title">' + safeTitle + '</div>' +
                    '<div class="h-artist">' + safeArtist + '</div>' +
                    '</div>';
        }
        html += '</div>';
        container.innerHTML = html;
    })
    .catch(function() {
        container.innerHTML = '<div class="section-title">🎵 ' + title + '</div><p style="color:#aaa; font-size:12px;">Ошибка сети</p>';
    });
}

function playRecommendation(index) {
    queue = window.recQueue;
    playTrack(index);
}
// ===========================

function renderList(containerId, data, title) {
  var container = document.getElementById(containerId);
  if(data.length === 0) { container.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:20px;">Пусто</p>'; return; }
  
  var html = '';
  for(var i=0; i<data.length; i++) {
    var t = data[i];
    var isFav = false; for(var j=0; j<favs.length; j++) { if(favs[j].id === t.id) isFav = true; }
    var isDl = false; for(var k=0; k<downloads.length; k++) { if(downloads[k].id === t.id) isDl = true; }
    
    var safeTitle = (t.title||'').replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c] || c; });
    var safeArtist = (t.artist||'').replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c] || c; });
    
    html += '<div class="track" onclick="playTrackFromList(\'' + containerId + '\', ' + i + ')">' +
            '<img src="' + (t.thumb || defaultImg) + '">' +
            '<div class="track-info"><div class="t-title">' + safeTitle + '</div><div class="t-artist">' + safeArtist + '</div></div>' +
            '<button class="action-btn ' + (isFav?'active':'') + '" onclick="event.stopPropagation(); toggleFav(\'' + containerId + '\', ' + i + ', this)">' + (isFav?'❤️':'♡') + '</button>' +
            '<button class="action-btn" onclick="event.stopPropagation(); downloadTrack(\'' + containerId + '\', ' + i + ', this)">' + (isDl?'✓':'⬇') + '</button>' +
            '</div>';
  }
  container.innerHTML = html;
}

function doSearch() {
  var q = document.getElementById('q').value; if(!q) return;
  // Скрываем рекомендации при поиске, чтобы они не мешали
  document.getElementById('home-recommendations').style.display = 'none';
  
  switchTab('search');
  document.getElementById('list-search').innerHTML = '<p style="text-align:center; padding:20px;">Поиск...</p>';
  
  fetch('/search?q=' + encodeURIComponent(q))
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if(data.error) { document.getElementById('list-search').innerText = data.error; return; }
    queue = data;
    document.getElementById('list-search').innerHTML = '<div class="section-title">Результаты</div>';
    renderList('list-search', data, '');
  }).catch(function() { document.getElementById('list-search').innerText = 'Ошибка сети (Сервер спит)'; });
}

function playTrackFromList(containerId, index) {
  if(containerId === 'list-search') queue = queue;
  else if(containerId === 'list-favs') queue = favs;
  else if(containerId === 'list-downloads') queue = downloads;
  playTrack(index);
}

function toggleFav(containerId, index, btn) {
  var track;
  if(containerId === 'list-search') track = queue[index];
  else if(containerId === 'list-favs') track = favs[index];
  else if(containerId === 'list-downloads') track = downloads[index];
  
  var idx = -1; for(var i=0; i<favs.length; i++) { if(favs[i].id === track.id) idx = i; }
  if(idx !== -1) { favs.splice(idx, 1); btn.innerText = '♡'; btn.className = 'action-btn'; }
  else { favs.push(track); btn.innerText = '❤️'; btn.className = 'action-btn active'; }
  localStorage.setItem('favs', JSON.stringify(favs));
  
  if(currentIndex !== -1 && queue[currentIndex].id === track.id) {
    var isF = idx === -1;
    document.getElementById('fp-fav').innerText = isF ? '❤️' : '♡';
    document.getElementById('fp-fav').className = 'fp-action-btn ' + (isF?'active':'');
  }
}

function downloadTrack(containerId, index, btn) {
  var track;
  if(containerId === 'list-search') track = queue[index];
  else if(containerId === 'list-favs') track = favs[index];
  else if(containerId === 'list-downloads') track = downloads[index];
  
  btn.innerText = '⏳';
  fetch('/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id: track.id, url: track.url})})
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if(d.error) throw new Error(d.error);
    track.file = d.file;
    var idx = -1; for(var i=0; i<downloads.length; i++) { if(downloads[i].id === track.id) idx = i; }
    if(idx !== -1) downloads.splice(idx, 1);
    downloads.push(track);
    localStorage.setItem('downloads', JSON.stringify(downloads));
    btn.innerText = '✓';
    if(currentIndex !== -1 && queue[currentIndex].id === track.id) {
      document.getElementById('fp-dl').innerText = '✓';
    }
  }).catch(function(e) { alert(e.message); btn.innerText = '⬇'; });
}

function playTrack(index) {
  if(!queue || index < 0 || index >= queue.length) return;
  
  currentIndex = index;
  var t = queue[index];
  
  // СОХРАНЯЕМ ТЕКУЩИЙ ТРЕК ДЛЯ РЕКОМЕНДАЦИЙ
  lastPlayed = t;
  localStorage.setItem('lastPlayed', JSON.stringify(t));

  document.getElementById('full-player').style.display = 'flex';
  document.getElementById('mini-player').style.display = 'flex';
  document.getElementById('fp-thumb').src = t.thumb || defaultImg;
  document.getElementById('mini-thumb').src = t.thumb || defaultImg;
  document.getElementById('fp-title').innerText = t.title;
  document.getElementById('mini-title').innerText = t.title;
  document.getElementById('fp-artist').innerText = 'Загрузка...';
  
  var isF = false; for(var i=0; i<favs.length; i++) { if(favs[i].id === t.id) isF = true; }
  document.getElementById('fp-fav').innerText = isF ? '❤️' : '♡';
  document.getElementById('fp-fav').className = 'fp-action-btn ' + (isF?'active':'');
  
  var isD = false; for(var i=0; i<downloads.length; i++) { if(downloads[i].id === t.id) isD = true; }
  document.getElementById('fp-dl').innerText = isD ? '✓' : '⬇';

  audio.pause();
  var downloaded = null;
  for(var i=0; i<downloads.length; i++) { if(downloads[i].id === t.id) downloaded = downloads[i]; }

  if (downloaded) {
    audio.src = '/play/' + downloaded.file; 
    audio.load(); audio.play();
    document.getElementById('fp-artist').innerText = t.artist;
  } else {
    fetch('/stream_url?url=' + encodeURIComponent(t.url))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if(d.stream_url) {
        audio.src = d.stream_url; 
        audio.load(); audio.play();
        document.getElementById('fp-artist').innerText = t.artist;
      } else throw new Error('Нет потока');
    }).catch(function() {
      downloadTrack('list-search', currentIndex, document.getElementById('fp-dl'));
      setTimeout(
